org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
# R8 需要较大的 Java 堆；降低其它子进程内存以适配沙箱总内存（约 5.8Gi/3 核）
# 沙箱外网经本地代理访问；Gradle 不读系统 HTTPS_PROXY，需显式指定 JVM 代理属性
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=18080
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=18080
systemProp.http.nonProxyHosts=localhost|127.0.0.1|.svc|.cluster.local
systemProp.https.nonProxyHosts=localhost|127.0.0.1|.svc|.cluster.local
org.gradle.workers.max=1
# 限制 Kotlin daemon 内存，避免与 Gradle daemon 叠加触发 cgroup OOM（沙箱仅 5.8Gi 内存）
kotlin.daemon.jvmargs=-Xmx512m -XX:MaxMetaspaceSize=256m
# 关闭 Gradle 并行以降低峰值内存
org.gradle.parallel=false
android.useAndroidX=true
kotlin.incremental=false
kotlin.incremental.js=false
kotlin.incremental.jvm=false
kotlin.caching.enabled=false
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
android.sdk.dir=/opt/android-sdk
# 保留资源原名：桌面快捷方式图标通过 getIdentifier("ic_shortcut_*", "drawable", pkg)
# 字符串查找，AGP 资源名混淆会把 drawable 重命名为短名（如 res/a.xml），
# 导致运行时按原名找不到图标。关闭资源优化（保留 shrinkResources 删除功能，
# 图标由 res/raw/keep.xml 的 tools:keep 兜底保留）。
android.enableResourceOptimizations=false
