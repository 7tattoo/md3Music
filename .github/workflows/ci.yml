name: CI Build

on:
  push:
    branches: [main, master, rust-local-two, car-adapt]
  pull_request:
    branches: [main, master, rust-local-two, car-adapt]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Android APK (arm64-v8a)
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      # 拉取代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 基础工具链
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "cmdline-tools;latest" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # ============================================================
      # Rust 后端交叉编译（arm64-v8a）
      # 仓库内 jniLibs/*.so 是预编译产物；歌单修复等 Rust 侧改动
      # 必须在 CI 重新编译才会进包，否则装出来的 APK 仍是旧逻辑。
      # ============================================================
      - name: Set up Rust (aarch64-linux-android)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            kugou_api_server/rust/target
          key: cargo-${{ runner.os }}-${{ hashFiles('kugou_api_server/rust/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Build libkugou_server.so (arm64-v8a)
        run: |
          set -e
          NDK="$ANDROID_HOME/ndk/28.2.13676358"
          if [ ! -d "$NDK" ]; then
            NDK="$(ls -1d "$ANDROID_HOME"/ndk/* | sort -V | tail -1)"
          fi
          echo "Using NDK: $NDK"
          BIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          cd kugou_api_server/rust
          env CC_aarch64_linux_android="$BIN/aarch64-linux-android21-clang" \
              AR_aarch64_linux_android="$BIN/llvm-ar" \
              CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$BIN/aarch64-linux-android21-clang" \
              cargo build --release --target aarch64-linux-android
          cd ../..
          cp kugou_api_server/rust/target/aarch64-linux-android/release/libkugou_server.so \
             android/app/src/main/jniLibs/arm64-v8a/libkugou_server.so
          ls -lh android/app/src/main/jniLibs/arm64-v8a/libkugou_server.so

      # 缓存 Gradle
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # GitHub runner 仅 7GB 内存：仓库默认 8G/4G 会 OOM（exit 143）
      - name: Limit Gradle JVM memory for CI runner
        run: |
          set -e
          sed -i 's|^org.gradle.jvmargs=.*|org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError|' android/gradle.properties
          # Windows SDK 路径在 Linux runner 上无意义，交给 flutter 生成 local.properties
          sed -i '/^android.sdk.dir=/d' android/gradle.properties
          cat android/gradle.properties

      # Flutter 构建
      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter analyze
        continue-on-error: true
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      # 下载 release keystore（可选，不存在时用 debug keystore 兜底）
      - name: Download release keystore
        id: keystore
        continue-on-error: true
        run: |
          set -e
          echo "Downloading release.keystore from 'keystore' release..."
          if ! curl -fL --retry 3 -o /tmp/release.keystore \
              "https://github.com/${GITHUB_REPOSITORY}/releases/download/keystore/release.keystore"; then
            echo "keystore release 不存在，使用 debug keystore"
            echo "keystore_available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cp /tmp/release.keystore android/app/release.keystore
          rm /tmp/release.keystore
          echo "keystore_available=true" >> "$GITHUB_OUTPUT"

      - name: Generate keystore.properties (for CI)
        if: steps.keystore.outputs.keystore_available == 'true'
        run: |
          set -e
          cat > android/keystore.properties <<EOF
          storePassword=${KEYSTORE_PASSWORD:-android}
          keyPassword=${KEY_PASSWORD:-android}
          keyAlias=${KEY_ALIAS:-androiddebugkey}
          storeFile=release.keystore
          EOF
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}

      # 构建 Release APK（仅 arm64-v8a：Rust 侧只交叉编译了该 ABI）
      - name: Flutter build APK (release, arm64-v8a)
        run: |
          flutter build apk --release \
            --target-platform android-arm64 \
            --dart-define=APP_VERSION=ci-${{ github.sha }}

      - name: Verify APK
        run: |
          ls -lh build/app/outputs/flutter-apk/
          # 不带 --split-per-abi 时产物名为 app-release.apk
          f=build/app/outputs/flutter-apk/app-release.apk
          [ -f "$f" ] || f=build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          unzip -l "$f" > /dev/null
          echo "OK ($(du -h "$f" | cut -f1))"
          echo "--- 包名校验 ---"
          unzip -p "$f" AndroidManifest.xml | strings -el | grep -o 'cn.kuwo.kwmusiccar' | head -1 || true
          echo "--- 归一化产物名供后续步骤使用 ---"
          cp "$f" build/app/outputs/flutter-apk/app-arm64-v8a-release.apk 2>/dev/null || true
          ls -lh build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

      - name: Upload arm64-v8a APK
        uses: actions/upload-artifact@v4
        with:
          name: app-arm64-v8a-release
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error
          retention-days: 14

      # 自动创建 Release 并上传 APK
      - name: Create CI Release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ci-${{ github.sha }}
          name: CI Build ${{ github.sha }}
          body: |
            ## CI 自动构建（车载适配版）

            **分支:** ${{ github.ref_name }}
            **提交:** ${{ github.sha }}
            **包名:** `cn.kuwo.kwmusiccar`（vivo 车机白名单）

            ### 本版包含
            - vivo 车载投屏歌词（设置 → 歌词 → 车载歌词）
            - 方向盘切歌修复（legacy MediaSession 拦截转发 App 队列）
            - 歌单创建/删除/加歌/删歌修复（cloudlist 路径 + x-router + userid 兜底）
            - Rust 后端在 CI 内重新交叉编译（歌单修复已进包）

            ### 下载
            - **app-arm64-v8a-release.apk** — arm64 设备（车机/绝大多数手机）

            > CI 自动构建，非正式发布版本。
          prerelease: true
          files: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
